apiVersion: v1
kind: Service
metadata:
  name: geotagger
  namespace: geotagger
spec:
  selector: {app: geotagger-api}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: admin, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geotagger-api
  namespace: geotagger
spec:
  replicas: 1
  selector:
    matchLabels: {app: geotagger-api}
  template:
    metadata:
      labels: {app: geotagger-api}
    spec:
      initContainers:
        - name: prepare-mmdb-volume
          image: busybox:1.37.0
          command: ["sh", "-c", "chown -R 65532:65532 /data && chmod 0750 /data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["CHOWN", "FOWNER"]}
          volumeMounts:
            - {name: mmdb, mountPath: /data}
        - name: seed-mmdb
          image: ghcr.io/jstarzz/geotagger-updater:latest
          env:
            - {name: MMDB_PATH, value: /data/GeoLite2-Country.mmdb}
            - name: MAXMIND_LICENSE_KEY
              valueFrom: {secretKeyRef: {name: geotagger-secrets, key: MAXMIND_LICENSE_KEY}}
          volumeMounts:
            - {name: mmdb, mountPath: /data}
      containers:
        - name: api
          image: ghcr.io/jstarzz/geotagger-api:latest
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          env:
            - {name: MMDB_PATH, value: /data/GeoLite2-Country.mmdb}
            - {name: NATS_URL, value: nats://nats:4222}
            - {name: AUDIT_IP_MODE, value: hmac}
            - name: API_KEYS
              valueFrom: {secretKeyRef: {name: geotagger-secrets, key: API_KEYS}}
            - name: AUDIT_HMAC_KEY
              valueFrom: {secretKeyRef: {name: geotagger-secrets, key: AUDIT_HMAC_KEY}}
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {cpu: "2", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: mmdb, mountPath: /data, readOnly: true}
      volumes:
        - name: mmdb
          hostPath:
            path: /var/lib/geotagger/mmdb
            type: DirectoryOrCreate
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geotagger-api
  namespace: geotagger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geotagger-api
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 2, periodSeconds: 15}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 50, periodSeconds: 60}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

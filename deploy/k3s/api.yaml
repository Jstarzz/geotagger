apiVersion: v1
kind: Service
metadata:
  name: geotagger
  namespace: geotagger
spec:
  type: ClusterIP
  selector: {app: geotagger-api}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: geotagger-admin
  namespace: geotagger
spec:
  type: ClusterIP
  selector: {app: geotagger-api}
  ports:
    - {name: admin, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geotagger-api
  namespace: geotagger
spec:
  replicas: 2
  selector:
    matchLabels: {app: geotagger-api}
  template:
    metadata:
      labels: {app: geotagger-api}
    spec:
      initContainers:
        - name: wait-for-mmdb
          image: busybox:1.37.0
          command: ["sh", "-c", "until [ -s /data/current/GeoLite2-City.mmdb ] && [ -s /data/current/GeoLite2-ASN.mmdb ]; do sleep 1; done"]
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: mmdb, mountPath: /data, readOnly: true}
      containers:
        - name: api
          image: ghcr.io/jstarzz/geotagger-api:latest
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          env:
            - {name: CITY_MMDB_PATH, value: /data/current/GeoLite2-City.mmdb}
            - {name: ASN_MMDB_PATH, value: /data/current/GeoLite2-ASN.mmdb}
            - {name: NATS_URL, value: nats://nats:4222}
            - {name: MANAGED_KEY_BUCKET, value: GEOTAGGER_API_KEYS}
            - {name: AUDIT_IP_MODE, value: hmac}
            - name: API_KEYS
              valueFrom: {secretKeyRef: {name: geotagger-secrets, key: API_KEYS}}
            - name: AUDIT_HMAC_KEY
              valueFrom: {secretKeyRef: {name: geotagger-secrets, key: AUDIT_HMAC_KEY}}
            - name: CF_ACCESS_TEAM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: geotagger-secrets
                  key: CF_ACCESS_TEAM_DOMAIN
                  optional: true
            - name: CF_ACCESS_AUD
              valueFrom:
                secretKeyRef:
                  name: geotagger-secrets
                  key: CF_ACCESS_AUD
                  optional: true
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            # HPA CPU utilization is calculated against requests, not limits.
            # 750m keeps the autoscaling signal aligned with meaningful CPU
            # pressure on the 9-vCPU single-node deployment.
            requests: {cpu: 750m, memory: 64Mi}
            limits: {cpu: "2", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: mmdb, mountPath: /data, readOnly: true}
      volumes:
        - name: mmdb
          hostPath:
            path: /var/lib/geotagger/mmdb
            type: DirectoryOrCreate
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geotagger-api
  namespace: geotagger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geotagger-api
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 2, periodSeconds: 15}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 50, periodSeconds: 60}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

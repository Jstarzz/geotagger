apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: geotagger
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-to-api
  namespace: geotagger
spec:
  podSelector:
    matchLabels: {app: geotagger-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: cloudflared}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-audit-clients-to-nats
  namespace: geotagger
spec:
  podSelector:
    matchLabels: {app: nats}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: geotagger-api}
        - podSelector:
            matchLabels: {app: geotagger-audit-worker}
      ports:
        - {protocol: TCP, port: 4222}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-to-clickhouse
  namespace: geotagger
spec:
  podSelector:
    matchLabels: {app: clickhouse}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: geotagger-audit-worker}
      ports:
        - {protocol: TCP, port: 8123}

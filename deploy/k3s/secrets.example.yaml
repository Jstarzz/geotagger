apiVersion: v1
kind: Secret
metadata:
  name: geotagger-secrets
  namespace: geotagger
type: Opaque
stringData:
  # Static compatibility / break-glass keys: key-id:sha256(secret), comma separated.
  # Managed credentials created by the admin control plane are stored in NATS KV instead.
  API_KEYS: "azure-prod:REPLACE_WITH_SHA256_HEX"
  AUDIT_HMAC_KEY: "REPLACE_WITH_32_PLUS_RANDOM_BYTES"
  MAXMIND_LICENSE_KEY: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  CLOUDFLARE_TUNNEL_TOKEN: "REPLACE_ME"

  # Optional: configure both to enable the human admin control plane.
  # Obtain the audience tag from the Cloudflare Access self-hosted application.
  # CF_ACCESS_TEAM_DOMAIN: "your-team.cloudflareaccess.com"
  # CF_ACCESS_AUD: "REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG"

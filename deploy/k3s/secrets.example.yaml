apiVersion: v1
kind: Secret
metadata:
  name: geotagger-secrets
  namespace: geotagger
type: Opaque
stringData:
  # API_KEYS contains key-id:sha256(secret), comma separated. Never store client secrets here.
  API_KEYS: "azure-prod:REPLACE_WITH_SHA256_HEX"
  AUDIT_HMAC_KEY: "REPLACE_WITH_32_PLUS_RANDOM_BYTES"
  MAXMIND_LICENSE_KEY: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  CLOUDFLARE_TUNNEL_TOKEN: "REPLACE_ME"

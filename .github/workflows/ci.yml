name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: geotagger
            image: geotagger-api
          - target: audit-worker
            image: geotagger-worker
          - target: mmdb-updater
            image: geotagger-updater
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: TARGET=${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jstarzz/${{ matrix.image }}:latest
            ghcr.io/jstarzz/${{ matrix.image }}:${{ github.sha }}

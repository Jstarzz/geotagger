name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  integration-audit:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_CLICKHOUSE_PASSWORD: geotagger-integration-password-0123456789
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Start NATS and ClickHouse
        run: |
          docker run -d --name geotagger-nats -p 4222:4222 nats:2.14.6-alpine -js -sd /data
          docker run -d --name geotagger-clickhouse -p 8123:8123 \
            -e CLICKHOUSE_DB=geotagger \
            -e CLICKHOUSE_USER=geotagger_ingest \
            -e CLICKHOUSE_PASSWORD="$INTEGRATION_CLICKHOUSE_PASSWORD" \
            clickhouse/clickhouse-server:26.3.33.24-alpine@sha256:67e3716310e54050a7164b1f535c81e59c397654b158aa50b488218cbdc77144
      - name: Wait for NATS
        shell: bash
        run: |
          for i in {1..40}; do
            if (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1; then exit 0; fi
            sleep 0.25
          done
          docker logs geotagger-nats
          exit 1
      - name: Test durable audit pipeline
        run: go test -tags=integration ./integration -count=1 -v
      - name: Service logs on failure
        if: failure()
        run: |
          docker logs geotagger-nats || true
          docker logs geotagger-clickhouse || true

  validate-deploy:
    runs-on: ubuntu-latest
    env:
      REDOCLY_TELEMETRY: off
      REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate deployment script syntax
        run: sh -n scripts/deploy-k3s.sh
      - name: Render K3s manifests
        run: kubectl kustomize deploy/k3s > /tmp/geotagger-manifests.yaml
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.52.1 lint openapi.yaml
      - name: Verify pinned ClickHouse LTS image exists and starts
        run: docker run --rm --entrypoint clickhouse clickhouse/clickhouse-server:26.3.33.24-alpine@sha256:67e3716310e54050a7164b1f535c81e59c397654b158aa50b488218cbdc77144 --version

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: geotagger
            image: geotagger-api
          - target: audit-worker
            image: geotagger-worker
          - target: mmdb-updater
            image: geotagger-updater
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          build-args: TARGET=${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/jstarzz/${{ matrix.image }}:latest
            ghcr.io/jstarzz/${{ matrix.image }}:${{ github.sha }}
